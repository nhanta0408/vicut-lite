name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches or screenshots welcome.
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this once it's agreed.
